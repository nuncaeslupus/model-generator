project:
  name: "User Auth Example"
  description: "Example project demonstrating model-generator features"
  version: "1.0.0"

stack: python-fastapi

# Optional: Python import root for src-layout projects.
# When set, this prefix is stripped from paths.* when forming import strings.
# Filesystem paths are unchanged.
# E.g., python_root: "src" + database_models: "src/hub/database/models" →
#   generated import: `from hub.database.models import X`
#   (instead of `from src.hub.database.models import X`)
# python_root: "src"

# Generated layout: how generated code is split across files.
#   per-entity (default): one file per entity, e.g. models/user.py + models/role.py.
#   per-domain:           one file per spec domain, e.g. models/users.py with both.
# Per-entity is the recommended default — keeps diffs small as a domain grows
# and lets adopters move individual entities into their own modules later.
# generation:
#   layout: per-entity

paths:
  # Infrastructure (generated once)
  base: backend/src/database/models/base.py
  engine: backend/src/database/engine.py
  main: backend/src/main.py
  errors: backend/src/api/errors.py
  validators: backend/src/api/validators.py
  test_conftest_root: tests/conftest.py
  # Domain-specific (generated per domain)
  database_models: backend/src/database/models
  factories: backend/tests/factories
  api_models: backend/src/api/models
  api_routes: backend/src/api/routes
  api_tests: tests/contract/api
  enums: backend/src/database/models/enums.py
  constraints: backend/src/database/models/constraints.py
  migrations: alembic

# Optional: override quality-tool defaults in the generated pyproject.toml.
# Any key not listed falls through to the tool's own default (ruff/mypy).
# style:
#   python_version: "3.12"   # drives requires-python + mypy python_version
#   line_length: 100
#   quote_style: "single"
#   indent_style: "tab"

# Optional: application hardening settings (defaults shown; uncomment to change).
# app:
#   # Reject request bodies larger than this many bytes with a 413, before they
#   # are read into memory. Generous default; set to 0 to disable the limit.
#   max_request_body_bytes: 10485760   # 10 MiB
#   # When true, the 409 duplicate-value error names the offending column.
#   # Off by default so error bodies never leak internal schema/column names.
#   expose_integrity_error_fields: false

# Required when any entity declares api.scope (owner-scoped endpoints).
# The generator imports this dependency and threads it into list/get/update/delete
# handlers via FastAPI's Depends(). When auth.strategy is also set (below), the
# generator emits get_current_user itself and auto-wires dependency_path — so
# adopters can leave dependency_path unset.
auth:
  # §12 — auth scaffolding (bcrypt + HMAC-SHA256 pepper, itsdangerous-signed
  # session cookies + DB-backed UserSession rows, double-submit-cookie CSRF
  # middleware, slowapi rate limiting on register/login/forgot-password).
  # Setting `strategy` opts the project into the full stack; the generator
  # emits the auth router, csrf middleware, and rate-limit module next to
  # each other under `auth.path`'s directory (default backend/src/auth/).
  strategy: bcrypt-session
  pepper_env: APP_PASSWORD_PEPPER
  # dependency_path: auto-wired to backend.src.auth.router.get_current_user
