[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-generator-kit"
version = "0.1.0"
description = "One-shot bootstrap generator for database models, API models, routes, and tests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "nuncaeslupus", email = "imarcos@gmail.com" }
]
keywords = ["generator", "code-generator", "fastapi", "sqlalchemy", "pydantic", "boilerplate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
interactive = [
    "questionary>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "questionary>=2.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.0.0",
    "mutmut>=2.4.0",
    "sqlalchemy>=2.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
model-gen = "model_generator.generate:main"
model-val = "model_generator.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_generator = ["py.typed", "schema/*.json", "stacks/**/*.yaml", "stacks/**/*.j2"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".claude/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "cli: marks tests as CLI tests",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_no_return = true
show_error_codes = true
exclude = [".claude/", "examples/", "tmp/"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__", "**/.*", "examples", "tmp"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.mutmut]
paths_to_mutate = ["src/model_generator/"]
tests_dir = ["tests/"]
also_copy = ["examples/"]
backup = false

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
