[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-generator-kit"
version = "0.1.4"
description = "One-shot bootstrap generator for database models, API models, routes, and tests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "nuncaeslupus", email = "imarcos@gmail.com" }
]
keywords = ["generator", "code-generator", "fastapi", "sqlalchemy", "pydantic", "boilerplate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
interactive = [
    "questionary>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "questionary>=2.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.0.0",
    "mutmut>=2.4.0,<3.5.0",  # 3.5.0 is broken (resets .meta, hangs); see CLAUDE.md
    "sqlalchemy>=2.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
model-gen = "model_generator.generate:main"
model-val = "model_generator.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_generator = ["py.typed", "schema/*.json", "stacks/**/*.yaml", "stacks/**/*.j2"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".claude/"]

[tool.ruff.lint]
# Broadened beyond the E/W/F/I baseline to match the project's global standard:
# flake8-bugbear, flake8-simplify, pyupgrade, flake8-use-pathlib, and Ruff's own
# rules catch real correctness/portability issues (notably PTH = missing-encoding
# file I/O, which is a Windows footgun).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
]
ignore = [
    # The `ℹ` (U+2139 INFORMATION SOURCE) prefix in CLI status messages is an
    # intentional info marker, not an ambiguous-for-a-Latin-letter typo.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures idiomatically use os.getcwd()/open() for chdir save-restore and
# reading spec files; the pathlib rules add churn without value in the suite.
"tests/**" = ["PTH109", "PTH123"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_no_return = true
show_error_codes = true
exclude = [".claude/", "examples/", "tmp/", "mutants/"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__", "**/.*", "examples", "tmp"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.mutmut]
paths_to_mutate = ["src/model_generator/"]
tests_dir = ["tests/"]
also_copy = ["examples/"]
backup = false

