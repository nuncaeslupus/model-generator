# Flutter (Dart) Stack Configuration
# Maps abstract types to Dart implementations and drives the freezed/
# json_serializable/retrofit codegen client emitted from a *.model.json spec.
#
# NOTE: Project-specific config (name, description, flutter.package_name) should
#       be overridden in <project-root>/.model-generator.yaml.

stack:
  name: flutter
  description: Flutter (Dart) client — freezed models, retrofit API client
  version: "1.0"

# Flutter-specific settings. ``package_name`` drives both the on-disk
# ``lib/<package_name>/…`` layout and the ``package:<package_name>/…`` imports
# in generated Dart. Overridable per-project in .model-generator.yaml.
flutter:
  package_name: app_api

# Required Dart packages for generated code. The generator never shells out to
# ``dart pub get``; these are emitted into pubspec.yaml for the user to install.
dependencies:
  runtime:
    - "freezed_annotation"
    - "json_annotation"
    - "dio"
    - "retrofit"
    - "decimal"
  # Conditional: only needed when the project enables an auth strategy that
  # persists a token/cookie client-side.
  conditional:
    auth:
      - "flutter_secure_storage"
  dev:
    - "build_runner"
    - "freezed"
    - "json_serializable"
    - "retrofit_generator"
    - "flutter_lints"

# Output paths relative to project root. ``{pkg}`` is substituted with
# ``flutter.package_name`` at generation time so the whole tree is configurable.
paths:
  models: "lib/{pkg}/models"
  enums: "lib/{pkg}/models/enums.dart"
  api_client: "lib/{pkg}/api"
  repositories: "lib/{pkg}/repositories"
  api_core: "lib/{pkg}/core"

# Quality tools. ``dart format`` accepts the generated file paths (per-file,
# like ``ruff format``); ``dart analyze`` must run from the package root so it
# can resolve imports against pubspec.yaml / analysis_options.yaml. Both no-op
# gracefully when the Dart SDK is absent (generation never requires it).
quality:
  formatter:
    command: "dart format ."
    target: package-root
  analyzer:
    command: "dart analyze"
    target: package-root

# Naming conventions (documentary — enforced by the generators/templates).
naming:
  model: PascalCase
  field: camelCase # Dart member; wire JSON stays snake_case via @JsonKey
  enum: PascalCase
  enum_value: UPPER_CASE
  json_key: snake_case

# Type mappings: abstract -> Dart. ``dart`` is the field type; ``converter`` is
# the freezed/json_serializable JsonConverter annotation (when the wire form
# differs from the Dart type); ``import`` lists any extra Dart imports the type
# pulls into a model file beyond the always-present freezed/json_annotation ones.
types:
  uuid:
    dart: "String"

  reference:
    dart: "String"

  text:
    dart: "String"

  longtext:
    dart: "String"

  financial:
    # Carried as a JSON *string* (byte-compatible with the FastAPI Numeric wire
    # format) and decoded to a Decimal via the project's DecimalConverter.
    dart: "Decimal"
    converter: "DecimalConverter"
    imports:
      - "package:decimal/decimal.dart"

  percentage:
    dart: "Decimal"
    converter: "DecimalConverter"
    imports:
      - "package:decimal/decimal.dart"

  counter:
    dart: "int"

  # "integer" is normalized to "counter" at load time; kept for completeness.
  integer:
    dart: "int"

  boolean:
    dart: "bool"

  datetime:
    # ISO8601 with trailing 'Z' on the wire; UtcDateTimeConverter round-trips it.
    dart: "DateTime"
    converter: "UtcDateTimeConverter"

  binary:
    # base64 string on the wire; BytesConverter decodes to Uint8List.
    dart: "Uint8List"
    converter: "BytesConverter"
    imports:
      - "dart:typed_data"

  enum:
    # Concrete enum type name comes from the field's ``enum_name``.
    dart: "{enum_name}"

  json_object:
    dart: "Map<String, dynamic>"

  json_array:
    # ``list_type`` defaults to ``dynamic`` when unspecified.
    dart: "List<{list_type}>"
