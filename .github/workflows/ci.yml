name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy . --explicit-package-bases
      - name: Verify version strings in sync
        run: make check-version-sync

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -v

  # Highest-value guard: regenerate the bundled example and run its *emitted*
  # contract suite. Catches template changes that ship importable-but-broken
  # code (which the mocked/string-matched unit suite cannot). The generated
  # stack uses PEP 695 generics, so this runs on 3.12.
  generated-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: make smoke-example

  # Smoke-tests the catalog-api example: per-domain layout, api-key auth,
  # composite-FK (Warehouse/StockEntry with api.enabled: false), and a
  # shared enum (_shared/enums.json ProductStatus).
  generated-catalog-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: make smoke-catalog-api

  # Smoke-tests the flutter-app example: regenerates the Flutter client from
  # the catalog-api spec, runs dart pub get + build_runner, and verifies
  # dart analyze passes (zero errors). Guards the Flutter templates and the
  # shared engine changes from Phase 0.
  generated-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: uv sync --extra dev
      - run: make smoke-flutter
